# Locales
# Set installation language to US English
d-i debian-installer/language string en_US:en

# Set installation country to United States
d-i debian-installer/country string US

Set system locale to en_US.UTF-8
d-i debian-installer/locale string en_US.UTF-8

# Keyboard
# Set keyboard layout to US
d-i keyboard-configuration/xkb-keymap select us

# Network
# Automatically select network interface
d-i netcfg/choose_interface select auto

# Set hostname to 'debian'
d-i netcfg/get_hostname string debian

# Set domain to 'unassigned-domain'
d-i netcfg/get_domain string unassigned-domain

# Leave WEP key blank (no wireless configuration)
d-i netcfg/wireless_wep string

# Mirror
# Manually set mirror country
d-i mirror/country string manual

# Set mirror hostname to Tsinghua University's mirror
d-i mirror/http/hostname string mirrors.tuna.tsinghua.edu.cn

# Set mirror directory to '/debian'
d-i mirror/http/directory string /debian

# Leave proxy configuration blank
d-i mirror/http/proxy string

# Set Debian suite to 'stable'
d-i mirror/suite string stable

# Accounts
# Set encrypted root password
d-i passwd/root-password-crypted password $1$afasdf$3Z59fZWtyPR7eYDutEzK91

# Set full name for the user account to 'debian'
d-i passwd/user-fullname string debian

# Set username to 'debian
d-i passwd/username string debian

# Set encrypted password for the user account
d-i passwd/user-password-crypted password $1$afasdf$3Z59fZWtyPR7eYDutEzK91


# Clock and time zone
# Set system clock to UTC
d-i clock-setup/utc boolean true

# Set time zone to 'Asia/Shanghai'
d-i time/zone string Asia/Shanghai

# Enable NTP for time synchronization
d-i clock-setup/ntp boolean true

# Partitioning
# Select disk for partitioning
d-i partman-auto/disk string /dev/sda

# Use regular partitioning method
d-i partman-auto/method string regular

# Choose custom partitioning recipe named 'mypartitioning'
d-i partman-auto/choose_recipe select mypartitioning

# Confirm writing new partition table
d-i partman-partitioning/confirm_write_new_label boolean true

# Finish partitioning
d-i partman/choose_partition select finish

# Confirm partitioning
d-i partman/confirm boolean true

# Confirm no overwrite of existing data
d-i partman/confirm_nooverwrite boolean true
d-i partman-auto/expert_recipe string                         \
      mypartitioning ::                                       \
               1024 1 1024 fat32                                 \
                      $primary{ } $bootable{ }                \
                      method{ efi } format{ }              \
                      mountpoint{ /boot/efi }                     \
              .                                               \
              16384 2 16384  linux-swap                       \
                      $primary{ }                             \
                      method{ swap } format{ }                \
              .                                               \
              51200 3 -1 xfs                              \
                      $primary{ }                             \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ xfs }     \
                      mountpoint{ / }                         \
              .
on scheme is divided into three partitions, each ending with a period. Here is an example of the "/boot/efi" partition: "1024 1 1024 ext4". The first "1024" indicates the minimum partition size in MB. "1" represents the priority, where higher numbers indicate higher priority for determining the partitioning order. The second "1024" indicates the maximum partition size in MB. If the value is "-1", it means the partition will expand to use all remaining available space. "xfs" specifies the file system type, indicating that this partition will use the xfs file system. These are the parameters used: 1 $primary{ }:Primary partition,2 $bootable{ }:Bootable flag set,3 method{ efi }:This is the EFI system partition,4 format{ }:Confirm formatting,5 mountpoint{ /boot/efi } :Mount partition to/boot/efi,6 method{ swap }:Use as swap,7 method{ format }:Format the partition,8 use_filesystem{ }:Use a filesystem,9 filesystem{ xfs }:Use the xfs filesystem,10 mountpoint{ / } :Mount point for this partition is /.


# Base system
# Install AMD64 Linux kernel image
d-i base-installer/kernel/image string linux-image-amd64


# Apt
# Select security and updates services
d-i apt-setup/services-select multiselect security, updates

# Set security updates mirror to Tsinghua University's mirror
d-i apt-setup/security_host string mirrors.tuna.tsinghua.edu.cn 


# Package selection
# Select standard system utilities and SSH server tasks
tasksel tasksel/first multiselect standard, ssh-server

# Disable participation in the popularity contest
popularity-contest popularity-contest/participate boolean false


# Boot loader
# Install GRUB boot loader only for Debian
d-i grub-installer/only_debian boolean true

# Configure GRUB for multi-OS boot
d-i grub-installer/with_other_os boolean true

# Install GRUB to the default boot device
d-i grub-installer/bootdev  string default


# Finishing up
# Automatically reboot after installation
d-i finish-install/reboot_in_progress note
